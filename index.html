<div id="ytPlayer" style="position:fixed;bottom:-100px;right:-100px;width:1px;height:1px;"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player; let isPlaying=false;
function onYouTubeIframeAPIReady(){
 player=new YT.Player('ytPlayer',{
   height:'1',width:'1',
   videoId:'pjTbUXYug-U',
   playerVars:{loop:1,playlist:'pjTbUXYug-U',controls:0,rel:0}
 });
}
document.getElementById('musicBtn').onclick=()=>{
 if(!player) return;
 if(!isPlaying){
   player.playVideo();
   document.getElementById('musicBtn').innerText='⏸️';
   isPlaying=true;
 } else {
   player.pauseVideo();
   document.getElementById('musicBtn').innerText='▶️';
   isPlaying=false;
 }
};
